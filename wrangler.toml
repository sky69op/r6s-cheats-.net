# Cloudflare Pages — r6scheats.net (Git integration)
#
# Dashboard (Workers & Pages → Builds):
#   Build command     = npm run build
#   Build output dir  = dist
#   Deploy command    = (leave empty for Pages Git — dist/ is published automatically)
#
# Do NOT use `npx wrangler deploy` — this is a Pages project.
# Use `npm run deploy` only for manual wrangler pages deploy from your machine.
#
# Build environment variables:
#   PUBLIC_GSC_VERIFICATION = (Google Search Console HTML tag token)
#   PUBLIC_GA_MEASUREMENT_ID = (optional)
#   PUBLIC_DISCORD_URL = (optional)
name = "r6s-cheats--net"
compatibility_date = "2024-09-01"
pages_build_output_dir = "./dist"
