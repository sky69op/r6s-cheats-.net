# Cloudflare Workers — r6scheats.net (Git / Workers Builds)
#
# Dashboard (Workers & Pages → Settings → Build):
#   Build command  = npm run build
#   Deploy command = npx wrangler deploy   (default — do not use wrangler pages deploy)
#
# Workers Builds injects WORKERS_CI=1 and uses a Workers API token (not Pages API).
# Do not set pages_build_output_dir here — that routes deploy through Pages API and fails auth.
#
# Build environment variables:
#   PUBLIC_GSC_VERIFICATION = (Google Search Console HTML tag token)
#   PUBLIC_GA_MEASUREMENT_ID = (optional)
#   PUBLIC_DISCORD_URL = (optional)
name = "r6s-cheats--net"
compatibility_date = "2024-09-01"
main = "./worker/index.mjs"

[assets]
directory = "./dist"
binding = "ASSETS"
